name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - distro: ubuntu:24.04
            label: ubuntu-24.04
          - distro: debian:trixie
            label: debian-stable
          - distro: debian:sid
            label: debian-unstable

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install git and checkout dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          apt-get install -y \
            devscripts equivs build-essential fakeroot \
            libpipewire-0.3-dev libclang-dev libvulkan-dev \
            libxkbcommon-dev glslc libxdo-dev cmake pkg-config

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Update debian changelog
        run: |
          # Mark git repo as safe (container runs as root)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Generate changelog entries from commits since last tag
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"  * %s" "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"  * %s")
          fi

          # Create new changelog entry
          cat > /tmp/changelog_entry << EOF
          whisperme (${{ inputs.version }}) unstable; urgency=medium

          ${CHANGES}

           -- GitHub Actions <github-actions[bot]@users.noreply.github.com>  $(date -R)

          EOF

          # Prepend to existing changelog
          cat /tmp/changelog_entry debian/changelog > /tmp/new_changelog
          mv /tmp/new_changelog debian/changelog

      - name: Build debian package
        run: |
          rm -f debian/debhelper-build-stamp
          dpkg-buildpackage -nc -us -uc -b

      - name: Rename package with distro label
        run: |
          cd ..
          for f in whisperme_${{ inputs.version }}_*.deb; do
            newname="${f%.deb}~${{ matrix.label }}.deb"
            mv "$f" "$newname"
          done

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: ../whisperme_*~${{ matrix.label }}.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download all deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Test install Ubuntu package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/whisperme_${{ inputs.version }}_*~ubuntu-24.04.deb
          whisperme --help || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update debian changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"  * %s" "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"  * %s")
          fi
          cat > /tmp/changelog_entry << EOF
          whisperme (${{ inputs.version }}) unstable; urgency=medium

          ${CHANGES}

           -- GitHub Actions <github-actions[bot]@users.noreply.github.com>  $(date -R)

          EOF
          cat /tmp/changelog_entry debian/changelog > /tmp/new_changelog
          mv /tmp/new_changelog debian/changelog

      - name: Commit changelog and create tag
        run: |
          git add debian/changelog
          git commit -m "Release v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          generate_release_notes: true
          files: dist/whisperme_*.deb
