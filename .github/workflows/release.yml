name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:24.04
            label: ubuntu-24.04
          - distro: debian:trixie
            label: debian-stable
          - distro: debian:sid
            label: debian-unstable

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install git and checkout dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          apt-get install -y \
            devscripts equivs build-essential fakeroot \
            libpipewire-0.3-dev libclang-dev libvulkan-dev \
            libxkbcommon-dev libxdo-dev cmake pkg-config
          # glslc is packaged differently across distros
          apt-get install -y glslc || apt-get install -y glslang-tools

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Update debian changelog
        run: |
          # Mark git repo as safe (container runs as root)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Generate changelog entries from commits since last tag
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"  * %s" "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"  * %s")
          fi

          # Create new changelog entry
          cat > /tmp/changelog_entry << EOF
          whisperme (${{ inputs.version }}) unstable; urgency=medium

          ${CHANGES}

           -- GitHub Actions <github-actions[bot]@users.noreply.github.com>  $(date -R)

          EOF

          # Prepend to existing changelog
          cat /tmp/changelog_entry debian/changelog > /tmp/new_changelog
          mv /tmp/new_changelog debian/changelog

      - name: Build debian package
        run: |
          rm -f debian/debhelper-build-stamp
          dpkg-buildpackage -nc -us -uc -b -d

      - name: Collect and rename package
        run: |
          mkdir -p dist
          for f in ../whisperme_${{ inputs.version }}_*.deb; do
            base=$(basename "$f")
            newname="${base%.deb}~${{ matrix.label }}.deb"
            cp "$f" "dist/$newname"
          done

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: dist/*.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download all deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Test install Ubuntu package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/whisperme_${{ inputs.version }}_*~ubuntu-24.04.deb
          whisperme --help || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update debian changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"  * %s" "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"  * %s")
          fi
          cat > /tmp/changelog_entry << EOF
          whisperme (${{ inputs.version }}) unstable; urgency=medium

          ${CHANGES}

           -- GitHub Actions <github-actions[bot]@users.noreply.github.com>  $(date -R)

          EOF
          cat /tmp/changelog_entry debian/changelog > /tmp/new_changelog
          mv /tmp/new_changelog debian/changelog

      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Use GitHub's built-in release notes generator
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="v${{ inputs.version }}" \
              -f previous_tag_name="$PREV_TAG" \
              -f target_commitish="main" \
              --jq '.body') || true
          fi

          # Fallback: formatted commit list
          if [ -z "${NOTES:-}" ]; then
            echo "Falling back to commit-based release notes..."
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log --pretty=format:"- %s (%an)" "$PREV_TAG"..HEAD)
              RANGE="$PREV_TAG → v${{ inputs.version }}"
            else
              COMMITS=$(git log --pretty=format:"- %s (%an)")
              RANGE="initial → v${{ inputs.version }}"
            fi
            NOTES=$(printf "## Changes (%s)\n\n%s" "$RANGE" "$COMMITS")
          fi

          # Write to file (multi-line safe)
          echo "$NOTES" > /tmp/release_notes.md
          echo "Generated release notes:"
          cat /tmp/release_notes.md

      - name: Commit changelog and create tag
        run: |
          git add debian/changelog
          git commit -m "Release v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body_path: /tmp/release_notes.md
          files: dist/whisperme_*.deb
