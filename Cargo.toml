[package]
name = "whisperme"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "whispermed"
path = "src/bin/whispermed.rs"

[[bin]]
name = "whisperme"
path = "src/bin/whisperme.rs"

[[bin]]
name = "audio-level"
path = "src/bin/audio-level.rs"

[dependencies]
rust-ini = "*"
pipewire = "*"
nnnoiseless = "*"
whisper-rs = { path = "vendor/whisper-rs", features = ["vulkan"] }
eframe = "*"
spectrum-analyzer = "*"
circular-buffer = "*"
ureq = "*"
winit = { version = "*", features = ["wayland", "x11"] }
rubato = "*"
audioadapter = "*"
audioadapter-buffers = "*"
crossbeam-channel = "*"
libxdo = { version = "*", optional = true }
arboard = { version = "*", optional = true }
xkbcommon = { version = "*", optional = true }

[features]
default = ["xdo"]
xdo = ["dep:libxdo"]
clipboard = ["dep:arboard"]
ydotool = ["dep:xkbcommon"]
system = []      # Tests requiring audio hardware, display, or X11
slow_tests = []  # Slow tests (e.g., full transcription pipeline)

[dev-dependencies]
hound = "*"
