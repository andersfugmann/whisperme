[package]
name = "whisperme"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "whispermed"
path = "src/bin/whispermed.rs"

[[bin]]
name = "whisperme"
path = "src/bin/whisperme.rs"

[[bin]]
name = "whisperme-config"
path = "src/bin/whisperme-config.rs"

[dependencies]
rust-ini = "*"
pipewire = "*"
nnnoiseless = "*"
whisper-rs = { path = "vendor/whisper-rs", optional = true, features = ["vulkan"] }
eframe = "*"
spectrum-analyzer = "*"
circular-buffer = "*"
ureq = "*"
winit = { version = "*", features = ["wayland", "x11"] }
rubato = "*"
audioadapter = "*"
audioadapter-buffers = "*"
crossbeam-channel = "*"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
hardware = []    # Tests requiring audio hardware, display, or X11
slow_tests = []  # Slow tests (e.g., full transcription pipeline)

[dev-dependencies]
hound = "*"
